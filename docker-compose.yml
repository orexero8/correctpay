services:
  postgres:
    image: postgres:16-alpine
    container_name: cib-payments-postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cib-payments-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cib-payments-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://payments:payments@postgres:5432/payments
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
      MOCK_ADAPTER_ENABLED: "true"
      MOCK_WEBHOOK_SECRET: mock-dev-only-secret-not-for-production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data: